[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "alm-model-monitoring"
version = "0.1.0"
description = "Framework de monitoring MLOps pour les modèles comportementaux ALM, conçu pour Dataiku."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Mohamed" }]
keywords = ["alm", "mlops", "model-monitoring", "data-drift", "dataiku"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "joblib>=1.3",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
  "pydantic>=2.6,<3",
  "pyyaml>=6.0.1",
  "requests>=2.32",
  "tabulate>=0.10.0",
]

[project.optional-dependencies]
viz = ["plotly>=5.20", "nbformat>=5.10", "matplotlib>=3.8", "kaleido>=1.0"]
data = ["kagglehub>=0.3"]
spark = ["pyspark>=3.4"]
mlflow = ["mlflow>=2.9", "joblib>=1.3"]
dataiku = ["dataiku-api-client>=12.0"]
notebooks = ["jupyterlab>=4.1", "ipykernel>=6.29", "plotly>=5.20", "nbformat>=5.10"]

[project.scripts]
alm-monitor = "alm_monitoring.cli:main"

[project.urls]
Repository = "https://github.com/tealamenta/alm-model-monitoring"

[dependency-groups]
dev = [
  "pytest>=8.1",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "responses>=0.25",
  "ruff>=0.6",
  "mypy>=1.10",
  "bandit[toml]>=1.7.8",
  "pip-audit>=2.7",
  "pre-commit>=3.7",
  "pandas-stubs>=2.1",
  "types-PyYAML>=6.0",
  "types-requests>=2.32",
  "scipy-stubs>=1.14; python_version >= '3.10'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/alm_monitoring"]

# ---------------------------------------------------------------------------
# Ruff: PEP 8 + a strict, senior-level rule set
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 99
src = ["src", "tests", "scripts", "dataiku"]

[tool.ruff.lint]
select = [
  "E", "W",     # pycodestyle
  "F",          # pyflakes
  "I",          # isort
  "N",          # pep8-naming
  "D",          # pydocstyle
  "UP",         # pyupgrade
  "B",          # bugbear
  "A",          # builtins shadowing
  "C4",         # comprehensions
  "DTZ",        # naive datetimes
  "T20",        # print statements
  "SIM",        # simplify
  "ARG",        # unused arguments
  "PTH",        # pathlib over os.path
  "PL",         # pylint
  "RUF",        # ruff-specific
  "S",          # bandit (security)
  "ANN",        # type annotations
  "ERA",        # commented-out code
  "PD",         # pandas-vet
  "NPY",        # numpy
  "PERF",       # performance
  "TRY",        # exception hygiene
  "FBT",        # boolean traps
]
ignore = [
  "D203", "D213",       # conflicting docstring styles (keep D211/D212)
  "D105", "D107",       # magic methods / __init__ docstrings
  "ANN401",             # Any allowed where justified
  "PLR0913",            # many-args handled case by case
  "TRY003",             # long exception messages are fine with our hierarchy
  "PD011",              # .to_numpy() preference is noisy
  "FBT001", "FBT002",   # boolean parameters acceptable in config-driven APIs
  "RUF012",             # mutable class attributes checked by pydantic
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101", "S106", "D", "ANN", "PLR2004", "ARG", "SLF001", "PLR0913",
  "PLC0415", "PD101", "PERF401",
]
"scripts/**" = ["T20", "D"]
# Notebooks DSS : exécutés dans Jupyter, les print sont la sortie attendue.
"dataiku/notebooks/**" = ["T20", "D", "INP001"]
# Les règles métier de l'audit SONT des constantes numériques (bornes de DTI, FICO...) :
# les externaliser nuirait à la lisibilité ; `.fillna(False)` est l'usage pandas.
"src/alm_monitoring/data_audit.py" = ["PLR2004", "FBT003"]
"dataiku/**" = ["T20", "D", "INP001", "E402", "F401", "ANN"]
"notebooks/**" = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["alm_monitoring"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy: strict
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_return_any = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true
plugins = ["pydantic.mypy"]
files = ["src", "scripts"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "kagglehub.*", "plotly.*", "dataiku.*", "dataikuapi.*", "joblib.*", "mlflow.*", "pyspark.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --cov=alm_monitoring --cov-report=term-missing --cov-fail-under=90"
markers = [
  "unit: fast, isolated tests",
  "integration: end-to-end pipeline tests",
  "security: security regression tests",
  "slow: tests that take more than a few seconds",
]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:dateutil.*",
  "ignore::DeprecationWarning:jupyter_client.*",
  "ignore:distutils Version classes are deprecated:DeprecationWarning",
  "ignore::DeprecationWarning:pyspark.*",
  "ignore::ResourceWarning",
]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["alm_monitoring"]
omit = ["src/alm_monitoring/dataiku/_dataiku_sdk.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]

# ---------------------------------------------------------------------------
# bandit
# ---------------------------------------------------------------------------
[tool.bandit]
targets = ["src", "scripts", "dataiku"]
exclude_dirs = ["tests", ".venv"]
skips = []
